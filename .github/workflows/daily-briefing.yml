name: Daily BCS briefing

on:
  schedule:
    # GitHub cron is UTC (Asia/Dhaka = UTC+6, no DST). GitHub starts scheduled
    # runs late: on this repository 4-6 hours late, by a different amount each
    # day, so fixed run times can't hit 08:00. Instead the workflow fires a
    # cheap "tick" every 30 minutes through the night and morning. Each tick
    # runs a gate (app/schedule_gate.py, seconds) that reads the saved state
    # and the Dhaka clock: it builds today's edition once a tick lands after
    # 05:00, holds it, and releases it at 08:00 (a tick landing shortly before
    # 08:00 waits in the job and sends on time). Ticks with nothing to do stop
    # after the gate. The comments show each tick's nominal time; it usually
    # starts hours later. The edition is still sent at most once a day.
    # For an exact 08:00, also add the free external trigger in the README
    # ("deliver" mode at 07:58): manual/API runs are not delayed.
    - cron: "7 18 * * *"   # 00:07 Dhaka
    - cron: "37 18 * * *"   # 00:37 Dhaka
    - cron: "7 19 * * *"   # 01:07 Dhaka
    - cron: "37 19 * * *"   # 01:37 Dhaka
    - cron: "7 20 * * *"   # 02:07 Dhaka
    - cron: "37 20 * * *"   # 02:37 Dhaka
    - cron: "7 21 * * *"   # 03:07 Dhaka
    - cron: "37 21 * * *"   # 03:37 Dhaka
    - cron: "7 22 * * *"   # 04:07 Dhaka
    - cron: "37 22 * * *"   # 04:37 Dhaka
    - cron: "7 23 * * *"   # 05:07 Dhaka
    - cron: "37 23 * * *"   # 05:37 Dhaka
    - cron: "7 0 * * *"   # 06:07 Dhaka
    - cron: "37 0 * * *"   # 06:37 Dhaka
    - cron: "7 1 * * *"   # 07:07 Dhaka
    - cron: "37 1 * * *"   # 07:37 Dhaka
    - cron: "7 2 * * *"   # 08:07 Dhaka
    - cron: "37 2 * * *"   # 08:37 Dhaka
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run (dry-run never sends to Telegram)"
        type: choice
        default: offline
        options:
          - offline         # sample data + mock model: no API calls at all
          - dry-run         # real feeds + real model (OpenAI, Gemini fallback), no Telegram, state untouched
          - live            # send now: an extra edition with anything new (any number of times a day)
          - deliver         # today's scheduled edition: sent at 08:00 (waits if <=30 min early), at once if later
          - subscribers     # register new /start and /stop now, list subscribers
          - test-telegram   # register new subscribers, send each a test message
          - verify-sources  # check every configured feed live
          - check-model     # check the OpenAI and Gemini model ids work with your keys
          - status          # print a summary of the saved state

# Least privilege: the only write is committing state/state.json
# (news history and the subscriber list).
permissions:
  contents: write

jobs:
  gate:
    # Scheduled ticks only. Seconds long; decides whether the briefing job runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      notify: ${{ steps.gate.outputs.notify }}
      lag_minutes: ${{ steps.gate.outputs.lag_minutes }}
    steps:
      - name: Check out the latest saved state
        uses: actions/checkout@v5
        with:
          # The branch tip, not the commit this (possibly hours-late) tick was queued at.
          ref: ${{ github.ref }}
      - name: Decide what this tick does
        id: gate
        env:
          TICK_CRON: ${{ github.event.schedule }}
        # System Python, standard library only: no setup or pip install needed.
        run: python3 -m app.schedule_gate check

  briefing:
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.gate.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    # Building takes ~3-5 min; a run that lands just before 08:00 may wait up to
    # schedule.max_wait_minutes (30) before sending.
    timeout-minutes: 45
    # Never let two runs touch state at the same time. Queued runs wait.
    concurrency:
      group: bcs-briefing-state
      cancel-in-progress: false
    env:
      MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      # Crash notices to subscribers: scheduled runs only on the day's last chance
      # (decided by the gate); manual/external runs always.
      NOTIFY_ON_FAILURE: ${{ github.event_name != 'schedule' || needs.gate.outputs.notify == 'true' }}
      PIPELINE_MODES: " scheduled deliver live dry-run offline "
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Warn if repository is public
        # Scheduled runs don't carry repository details in their event payload,
        # so ask the API. Needs only the always-granted metadata permission.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility 2>/dev/null || echo unknown)"
          echo "Repository visibility: ${visibility}"
          if [ "$visibility" = "public" ]; then
            echo "::warning::This repository is public. state/state.json (reading history and your subscribers' Telegram chat ids and first names) is committed here. Make the repository private (Settings → General → Danger Zone)."
          fi

      - name: Check out repository (includes saved state)
        uses: actions/checkout@v5
        with:
          # Always the latest commit: a run that waited in the queue must see the
          # state saved by the run before it, or it could send an edition twice.
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Bengali fonts for the PDF
        if: contains(env.PIPELINE_MODES, format(' {0} ', env.MODE))
        # Best effort: without it the PDF may lack Bengali glyphs, but text messages are unaffected.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-core
          fc-list | grep -i -c bengali || true

      - name: Unit tests (fully mocked, no API calls)
        if: contains(env.PIPELINE_MODES, format(' {0} ', env.MODE))
        run: python -m pytest -q

      - name: Run (${{ env.MODE }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}   # primary model (paid, prepaid credit)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # fallback model (free tier)
          TELE_BOT_TOKEN: ${{ secrets.TELE_BOT_TOKEN }}
          # Optional: when set, people can only join via t.me/<bot>?start=<code>.
          BOT_INVITE_CODE: ${{ secrets.BOT_INVITE_CODE }}
          # Optional repository variable (Settings → Variables) to change model without a code change.
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          case "$MODE" in
            scheduled)      python -m app run --hold ;;   # tick: build + hold, or send at/after 08:00
            deliver)        python -m app run --hold ;;   # same, on demand (external 07:58 trigger)
            live)           python -m app run --manual ;; # manual: extra edition with anything new
            dry-run)        python -m app run --dry-run ;;
            offline)        python -m app run --offline ;;
            subscribers)    python -m app subscribers ;;
            test-telegram)  python -m app test-telegram ;;
            verify-sources) python -m app verify-sources ;;
            check-model)    python -m app check-model ;;
            status)         python -m app status ;;
            *) echo "::error::Unknown mode '$MODE'"; exit 3 ;;
          esac

      - name: Show the dry-run edition
        # Dry runs never send anything; print what would have been sent.
        if: always() && (env.MODE == 'dry-run' || env.MODE == 'offline')
        run: cat output/edition-*-dry-run.txt 2>/dev/null || echo "No edition text was written."

      - name: Notify Telegram about a failed run
        id: notify
        if: failure() && env.NOTIFY_ON_FAILURE == 'true' && (env.MODE == 'scheduled' || env.MODE == 'deliver' || env.MODE == 'live')
        env:
          TELE_BOT_TOKEN: ${{ secrets.TELE_BOT_TOKEN }}
        run: python -m app notify-failure

      - name: Count this run for the schedule gate
        # Even when an earlier step failed, so a persistent failure stops after
        # schedule.max_runs_per_day failed runs instead of retrying every tick.
        if: always() && (env.MODE == 'scheduled' || env.MODE == 'deliver')
        run: >
          python3 -m app.schedule_gate record
          --job-status "${{ job.status }}"
          --crash-notified "${{ steps.notify.outcome == 'success' }}"
          --lag-minutes "${{ needs.gate.outputs.lag_minutes }}"

      - name: Commit and push state
        if: always() && (env.MODE == 'scheduled' || env.MODE == 'deliver' || env.MODE == 'live' || env.MODE == 'subscribers' || env.MODE == 'test-telegram')
        run: |
          if [ ! -f state/state.json ]; then
            echo "No state file was produced; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -m "state: run for $(TZ=Asia/Dhaka date +%F)"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "State saved."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest remote commit."
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort
              echo "::error::state/state.json changed on the remote too. Not overwriting newer state. The state from this run is in the workflow artifact."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push state after 3 attempts. The state from this run is in the workflow artifact."
          exit 1

      - name: Upload edition and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: briefing-${{ env.MODE }}-${{ github.run_id }}
          path: |
            output/
            state/state.json
            state/*.corrupt-*
          if-no-files-found: ignore
          retention-days: 7
