# News source registry.
#
# Rules:
# - Only list a feed_url that has evidence of existing. Never guess.
# - `verification` records what evidence exists. Run
#   `python -m app verify-sources` (or the "verify-sources" workflow mode) to
#   check every feed live, including robots.txt, and update these fields.
# - A failing source never stops collection from the others.
# - `fetch_articles = false` means only the feed excerpt is used (excerpt-only).
#
# Allowed subjects:
#   bangladesh_affairs, international_affairs, economy, environment_climate,
#   science_technology, foreign_policy_geopolitics, constitution_governance,
#   awards_reports_indices
# Allowed types: newspaper, news_agency, official, international_org

[[source]]
id = "prothomalo"
name = "Prothom Alo (প্রথম আলো)"
homepage = "https://www.prothomalo.com/"
feed_url = "https://www.prothomalo.com/feed"
type = "newspaper"
language = "bn"
subjects = ["bangladesh_affairs", "economy", "international_affairs", "constitution_governance", "environment_climate"]
enabled = true
fetch_articles = true
timeout_seconds = 20
max_retries = 2
verification = "Feed URL taken from the owner's working prototype; not yet re-checked live from CI."

