# ------------------------------------------------------------ selection policy
[policy]
# Story types the screening model must choose from. Rejected types are dropped
# by code no matter what the model decides.
accepted_types = [
  "policy_decision", "law_constitution", "economic_data", "development_project",
  "diplomacy", "international_event", "international_org", "environment_disaster",
  "science_technology", "public_health", "report_index", "award_appointment",
]
rejected_types = [
  "opinion", "feature", "crime_accident", "local_admin", "party_politics",
  "court_case_individual", "foreign_domestic_minor", "sports_entertainment",
  "lifestyle", "religion_culture_local", "human_interest", "corporate_commercial",
  "other_low_value",
]

# Shown to the model as calibration examples (real items from earlier runs).
bad_examples = [
  "Donation boxes of a shrine opened and counted (local/religious, no exam value)",
  "City corporation warns against footpath shops (routine local notice)",
  "Police chief says extortionists are linked to power (statement, no decision)",
  "Banned student wing's procession / attack on police (party politics, law and order)",
  "Indian state chief minister attacks election commissioner's brother (foreign domestic trivia)",
  "Bangladeshis charged with immigration fraud in Canada (individual court case)",
  "Factory fire was hard to control due to water shortage (incident, no policy outcome)",
  "Opinion column or interview arguing what the government should do (opinion, no new fact)",
  "Road blockade in two hill districts ends, are vehicles moving? (daily situation update)",
  "A private bank offers loan transfers at 9 percent interest (single company's commercial offer)",
  "Regulator wants to move its head office to another building (office logistics)",
  "Foreign airport resumes flights after closure (operational update, no policy)",
]
good_examples = [
  "PM's state visit to Japan: agreements, investment and cooperation (bilateral relations)",
  "ECNEC approves 15 projects worth Tk X crore (development, budget data)",
  "Shipbreaking industry moved from Red to Orange category by Department of Environment (environment law)",
  "Bengali physicist Ashoke Sen receives the Oskar Klein Medal (award, prelims fact)",
  "US-Israel threaten Iran; regional military posture shifts (international conflict)",
  "Bangladesh Bank raises policy rate to X percent (monetary policy, prelims fact)",
  "Cabinet approves draft amendment to the Labour Act (law, written + prelims)",
  "COP31: Bangladesh and LDCs demand grant-based climate finance (climate diplomacy)",
  "Government renames a national institution or programme (prelims fact: new official name)",
]
