# BCS syllabus profile used to select news.
#
# Built from the BPSC syllabus (preliminary subjects; written papers 005
# Bangladesh Affairs, 007 International Affairs, 010 General Science & Technology,
# plus geography/environment/disaster management and ethics/good governance).
#
# Every story must map to one of these topics or it is dropped. Keep topics
# fine-grained: at most `selection.max_stories_per_topic` stories per topic are
# sent in one edition.
#
# subject = one of: bangladesh_affairs, international_affairs, economy,
#   environment_climate, science_technology, foreign_policy_geopolitics,
#   constitution_governance, awards_reports_indices

# ---------------------------------------------------------- Bangladesh affairs
[topic.bd_constitution]
label = "সংবিধান, সংশোধনী ও সাংবিধানিক প্রতিষ্ঠান"
subject = "constitution_governance"
hint = "constitutional amendments, constitutional bodies (EC, PSC, C&AG, Ombudsman), referendum, fundamental principles"

[topic.bd_parliament_law]
label = "সংসদ, আইন ও অধ্যাদেশ"
subject = "constitution_governance"
hint = "laws/ordinances passed or approved by cabinet, parliamentary procedure, major bills"

[topic.bd_judiciary]
label = "বিচার বিভাগ ও গুরুত্বপূর্ণ রায়"
