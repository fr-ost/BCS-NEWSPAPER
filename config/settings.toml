# BCS Newspaper Engine settings.
# Every value here can be changed without touching application code.
# Secrets never go in this file: they come from environment variables / GitHub Secrets.

[edition]
timezone = "Asia/Dhaka"
# The scheduled edition is prepared early and released at this local time.
delivery_time = "08:00"
# Target story count. These are limits, not quotas: low-relevance days send fewer.
min_target_stories = 5
max_stories = 8
# Stories scoring below this (0-100) are never included, even on a thin day.
min_story_score = 65
# Only consider items published within this window (hours) of the run.
freshness_hours = 36
# Number of MCQs in a complete edition.
mcq_count = 3

[schedule]
# GitHub starts scheduled workflows late (here 4-6 hours, varying), so the
# workflow fires a cheap "tick" every 30 minutes through the night and this
# gate decides what each tick does (app/schedule_gate.py). Local times.
# Ticks before this time do nothing (the morning's news isn't in yet).
prepare_from = "05:00"
# A tick landing this close to delivery_time waits and sends on time. Matches
# the 30-minute tick spacing, so some tick always lands inside the window.
max_wait_minutes = 30
# If today's edition still hasn't gone out by this time, skip it.
deliver_until = "22:00"
# A persistent failure stops after this many failed runs in a day.
max_runs_per_day = 5

[collection]
max_items_per_source = 40
# Hard caps to protect against huge/malicious responses.
max_feed_bytes = 3_000_000
max_article_bytes = 3_000_000
request_timeout_seconds = 20
request_retries = 2
# An honest user agent. We do not impersonate browsers or bypass blocks.
user_agent = "BCSNewspaperBot/1.0 (personal, non-commercial study briefing; respects robots.txt)"
respect_robots_txt = true

[extraction]
# Below this many characters the full text is treated as unavailable.
min_article_chars = 600
# Article text sent to the model is truncated to this length.
max_article_chars = 12_000
# Minimum excerpt length that permits a clearly labelled excerpt-only analysis.
min_excerpt_chars_for_analysis = 220

[selection]
# Recalibrated after reviewing real editions (see config/syllabus.toml).
# A story needs syllabus_relevance >= this (0-10) from the full analysis.
min_syllabus_relevance = 7
# "maybe" stories from screening are analysed only with priority >= this.
maybe_min_priority = 7
# Diversity: at most this many stories per syllabus topic in one edition.
max_stories_per_topic = 1

[filters]
# Dropped before any AI call. Matched as substrings of the URL path
# (lower-case). Covers Prothom Alo and Daily Star section paths.
exclude_url_paths = [
  "/sports/", "/entertainment/", "/lifestyle/", "/opinion/", "/religion/",
  "/video/", "/photo/", "/chakri/", "/fun/", "/celeb/", "/travel/", "/feature/",
  "/durporobash/", "/activities/", "/onnoalo/", "/bangladesh/district/",
  "/bangladesh/crime/", "/bangladesh/capital/", "/education/", "/biology/",
  "/physics/", "/technology/gadget/", "/astrology/", "/rashifol/", "/football/",
  "/cricket/", "/star-multimedia/", "/showbiz/", "/life-living/", "/shout/",
  "/tech-startup/", "/book-reviews/", "/campus/", "/star-youth/",
]
# Dropped if the title matches any of these (case-insensitive regex).
exclude_title_patterns = [
  "আজ টিভিতে", "রাশিফল", "পাঠকের ছবি", "ছবিতে দেখুন", "^ভিডিও", "লাইভ স্কোর",
  "\\bhoroscope\\b", "\\bin pictures\\b", "\\bphoto ?story\\b",
]

[screening]
# Max candidate events screened per run (a day brings ~70 new ones).
max_candidates = 80
# Candidates per screening request (smaller batches are judged more carefully).
batch_size = 40

[analysis]
# Maximum full-article analyses per run (each is one model call).
max_analyses_per_run = 14
# A story that fails analysis this many times is abandoned.
max_attempts_per_story = 3

# Stage E rubric. Initial heuristics, NOT validated predictions of exam questions.
# Weights must sum to 1.0. Each criterion is scored 0-10 by the model; the
# weighted total is scaled to 0-100.
[scoring.weights]
syllabus_relevance = 0.30
significance = 0.25
factual_density = 0.20
written_potential = 0.15
novelty = 0.10

[llm]
# Primary provider: "openai" (paid, prepaid credit), "gemini" (free tier),
# "ollama" (local, experimental) or "mock" (offline/testing).
provider = "openai"
# Used in order when the primary is out of credit/quota, rejects the key or
# model, or keeps failing. Gemini's free tier keeps the briefing coming.
# Set to [] to disable fallback (or env LLM_FALLBACK=none).
fallback_providers = ["gemini"]

# OpenAI. Verify the model id and price at https://openai.com/api/pricing
# Override with the OPENAI_MODEL environment variable / repository variable.
openai_model = "gpt-5.4-mini"
openai_api_base = "https://api.openai.com/v1"
# Optional: "low"/"minimal" cuts hidden reasoning tokens (cost) on reasoning
# models. Leave empty if your model rejects the parameter.
openai_reasoning_effort = ""
openai_min_seconds_between_calls = 1.0
# Only used to print an estimated cost per run (USD per 1M tokens).
openai_usd_per_million_input = 0.75
openai_usd_per_million_output = 4.50

# Gemini (fallback). Verify free-tier eligibility at
# https://ai.google.dev/gemini-api/docs/pricing. Override with GEMINI_MODEL.
gemini_model = "gemini-3.8-flash"
gemini_api_base = "https://generativelanguage.googleapis.com/v1beta"
ollama_model = "qwen2.5:7b-instruct"
ollama_base_url = "http://localhost:11434"
temperature = 0.2
max_output_tokens = 8192
request_timeout_seconds = 120
# Budget per provider across the whole run, including retries: screening (2),
# analyses (14), static GK + its check (2), MCQs (1) and some retries. Caps
# OpenAI spend and keeps Gemini well inside free-tier daily request quotas.
max_calls_per_run = 30
# Spacing between Gemini/Ollama calls (free-tier per-minute limits).
min_seconds_between_calls = 6.0
max_retries = 3
backoff_base_seconds = 4.0
backoff_max_seconds = 60.0
# Longest server-requested wait we will honour for a per-minute rate limit.
max_retry_after_seconds = 90.0

[telegram]
api_base = "https://api.telegram.org"
# Telegram's hard limit is 4096 characters; stay below it.
max_message_chars = 3800
request_timeout_seconds = 30
max_retries = 3
disable_web_page_preview = true
# Recipients are people who pressed Start in the bot (optionally via an
# invite link). This cap protects against strangers filling the list.
max_subscribers = 10
# Telegram allows about one message per second to the same chat.
min_seconds_between_messages = 1.1

[state]
path = "state/state.json"
# Articles older than this are pruned from state (keeps the file small).
retention_days = 14
max_run_history = 30

[output]
# Rendered editions are written here (git-ignored; uploaded as a workflow artifact).
dir = "output"
